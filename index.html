<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CYBER-VAULT // CLOUD TERMINAL</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- =========================================================
       1. AUTHENTICATION / LOGIN SCREEN
       ========================================================= -->
  <div id="login-screen">
    <div class="login-container">
      <h2>&gt; TERMINAL ACCESS CONTROL</h2>
      <p class="section-desc">&gt; ENTER ENCRYPTED CLEARANCE PASSKEY</p>

      <form id="login-form">
        <div class="input-group">
          <label for="passkey-input">&gt; SECURITY PASSKEY</label>
          <input 
            type="password" 
            id="passkey-input" 
            placeholder="e.g. KEY-8821-CYBER" 
            autocomplete="off" 
            required 
          />
        </div>

        <button type="submit" id="login-btn">
          [ AUTHENTICATE ] <span id="greeting-spinner" class="hidden"></span>
        </button>
      </form>

      <div id="error-msg"></div>
    </div>
  </div>

  <!-- =========================================================
       2. MAIN DASHBOARD SCREEN
       ========================================================= -->
  <div id="dashboard-screen" class="hidden">
    
    <!-- Header Zone -->
    <header class="dashboard-header">
      <div class="user-info">
        <span class="status-indicator"></span>
        <span id="user-display-name" class="user-display-name">OPERATOR: UNKNOWN</span>
        <span id="user-role-badge" class="badge">VIEWER</span>
      </div>
      <button id="logout-btn">[ TERMINATE SESSION ]</button>
    </header>

    <!-- File Upload Panel -->
    <section class="dashboard-card">
      <h3>&gt; TRANSMIT DOCUMENT TO CLOUD</h3>
      <div class="upload-controls">
        <input type="file" id="file-chooser" />
        <button id="upload-btn">UPLOAD TO CLOUD 📤</button>
      </div>
    </section>

    <!-- Repository Grid -->
    <section class="dashboard-card">
      <h3>&gt; CLOUD REPOSITORY FILES</h3>
      <div id="files-grid">
        <p class="type-target">&gt; SCANNING CLOUD REPOSITORY...</p>
      </div>
    </section>

    <!-- Admin Panel (Visible to Owner/Admin only) -->
    <section id="admin-section" class="admin-section hidden">
      <h3>&gt; ACCESS MANAGEMENT &amp; PROVISIONING</h3>
      
      <form id="create-user-form">
        <div class="admin-form-grid">
          <input type="text" id="new-username" placeholder="Operator Name" required />
          <input type="email" id="new-email" placeholder="Operator Email" required />
          <select id="new-role">
            <option value="viewer">VIEWER</option>
            <option value="owner">ADMIN / OWNER</option>
          </select>
          <input type="text" id="new-passkey" placeholder="Custom Passkey (Optional)" />
        </div>
        <button type="submit" style="margin-top: 15px;">[ PROVISION OPERATOR ]</button>
      </form>

      <h4 style="margin-top: 25px;">&gt; ACTIVE DIRECTORY LIST</h4>
      <div id="user-list-container"></div>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
