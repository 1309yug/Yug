<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0"/>
  <title>CYBER-VAULT // CLOUD TERMINAL</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- =========================================================
       1. AUTHENTICATION / LOGIN SCREEN
       ========================================================= -->
  <div id="login-screen">
    <div class="login-container">
      <h2>&gt; TERMINAL ACCESS CONTROL</h2>
      <p class="section-desc">&gt; ENTER 8-CHARACTER CLEARANCE PASSWORD</p>

      <form id="login-form">
        <div class="input-group">
          <label for="passkey-input">&gt; SECURITY PASSKEY (8 CHARS)</label>
          <input 
            type="password" 
            id="passkey-input" 
            placeholder="e.g. A8x9P2q1" 
            maxlength="8"
            autocomplete="off" 
            required 
          />
        </div>

        <button type="submit" id="login-btn">
          [ AUTHENTICATE ] <span id="greeting-spinner" class="hidden"></span>
        </button>
      </form>

      <div id="error-msg"></div>
    </div>
  </div>

  <!-- =========================================================
       2. MAIN DASHBOARD SCREEN
       ========================================================= -->
  <div id="dashboard-screen" class="hidden">
    
    <!-- Header Zone -->
    <header class="dashboard-header">
      <div class="user-info">
        <span class="status-indicator"></span>
        <div class="user-text-wrapper">
          <span id="user-display-name" class="user-display-name">OPERATOR: UNKNOWN</span>
          <span id="user-role-badge" class="badge">VIEWER</span>
        </div>
      </div>
      <button id="logout-btn" class="btn-secondary">[ TERMINATE SESSION ]</button>
    </header>

    <!-- File Upload Panel -->
    <section class="dashboard-card">
      <h3>&gt; TRANSMIT DOCUMENT TO CLOUD</h3>
      <div class="upload-controls">
        <input type="file" id="file-chooser" />
        <input 
          type="password" 
          id="upload-passphrase" 
          placeholder="🔑 Passphrase (Optional for Encryption)" 
          autocomplete="off" 
        />
        <button id="upload-btn" class="btn-primary">UPLOAD FILE 🚀</button>
      </div>
    </section>

    <!-- Repository Grid -->
    <section class="dashboard-card">
      <h3>&gt; CLOUD REPOSITORY FILES</h3>
      <div id="files-grid">
        <p class="type-target">&gt; SCANNING CLOUD REPOSITORY...</p>
      </div>
    </section>

    <!-- Admin Panel -->
    <section id="admin-section" class="admin-section hidden">
      <h3>&gt; ACCESS MANAGEMENT &amp; PROVISIONING</h3>
      
      <form id="create-user-form">
        <div class="admin-form-grid">
          <input type="text" id="new-username" placeholder="Operator Name" required />
          <input type="email" id="new-email" placeholder="Operator Email" required />
          <select id="new-role">
            <option value="viewer">VIEWER</option>
            <option value="owner">ADMIN / OWNER</option>
          </select>
          <input type="text" id="new-passkey" placeholder="8-Char Password (Optional)" maxlength="8" />
        </div>
        <button type="submit" class="btn-primary admin-submit-btn">[ PROVISION OPERATOR ]</button>
      </form>

      <h4 class="admin-subtitle">&gt; ACTIVE DIRECTORY LIST</h4>
      <div id="user-list-container"></div>
    </section>

  </div>

  <!-- =========================================================
       3. DECRYPTION MODAL OVERLAY
       ========================================================= -->
  <div id="decrypt-modal" class="hidden">
    <div class="login-container">
      <h3>&gt; DECRYPT ENCRYPTED FILE</h3>
      <p class="section-desc" id="decrypt-filename">&gt; ENTER PASSPHRASE TO UNLOCK</p>
      <div class="input-group" style="margin-top: 15px;">
        <label for="decrypt-passphrase">&gt; ENCRYPTION PASSPHRASE</label>
        <input type="password" id="decrypt-passphrase" placeholder="Enter key used during upload" autocomplete="off" />
      </div>
      <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button id="confirm-decrypt-btn" class="btn-primary" style="flex: 1;">[ DECRYPT ]</button>
        <button id="cancel-decrypt-btn" class="btn-secondary" style="flex: 1;">[ CANCEL ]</button>
      </div>
      <div id="decrypt-error-msg" style="margin-top: 10px; color: var(--amber-alert); font-size: 0.85rem;"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
